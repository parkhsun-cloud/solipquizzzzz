<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나를 맞혀 봐! 퀴즈</title>
<style>
  :root { --ink:#27345b; --purple:#7767e8; --pink:#ff83b4; --sky:#dff5ff; --yellow:#ffe58b; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    color:var(--ink); background:linear-gradient(180deg,#c7efff 0%,#e8f8ff 46%,#c9edc6 46%,#a7dba1 100%);
    display:flex; justify-content:center; padding:18px;
  }
  .game { width:min(850px,100%); }
  header { text-align:center; padding:15px 12px 8px; }
  h1 { margin:0; font-size:clamp(2rem,6vw,3.2rem); text-shadow:2px 3px 0 #fff; }
  .subtitle { margin:8px 0 0; font-weight:700; }
  .scene {
    position:relative; min-height:190px; margin:12px 0 16px; overflow:hidden;
    border:4px solid white; border-radius:24px; background:linear-gradient(#9edfff 0 66%,#80c97c 66%);
    box-shadow:0 8px 0 #7badd1;
  }
  .sun { position:absolute; width:60px;height:60px;border-radius:50%;background:#ffe77e;right:9%;top:16px;box-shadow:0 0 0 10px #ffe77e44; }
  .cloud { position:absolute; top:26px; left:12%; font-size:36px; }
  .school { position:absolute; bottom:32px; left:50%; transform:translateX(-50%); width:min(330px,70%); height:95px; background:#fff2d8; border:3px solid #d99d69; border-radius:7px 7px 0 0; text-align:center; }
  .school:before { content:""; position:absolute; top:-28px; left:-4px; width:calc(100% + 8px); height:28px; background:#ed8d86; clip-path:polygon(8% 0,92% 0,100% 100%,0 100%); }
  .school-name { position:relative; font-weight:900; font-size:clamp(12px,2.7vw,18px); margin-top:7px; }
  .windows { display:flex; justify-content:space-evenly; margin-top:10px; }
  .windows span { display:block; width:32px;height:28px;background:#9edfff;border:3px solid #d99d69; }
  .ground-label { position:absolute; bottom:5px; left:0; width:100%; text-align:center; font-size:12px; font-weight:800; color:#285b2a; }
  .student { position:absolute; bottom:8px; left:9%; width:78px; height:120px; animation:bob 2.3s ease-in-out infinite; }
  .hair { position:absolute; left:18px; top:0; width:43px;height:43px;background:#493126;border-radius:48% 48% 38% 38%; z-index:2; }
  .face { position:absolute; left:23px;top:8px;width:34px;height:39px;background:#ffd5b2;border-radius:45%;z-index:3; }
  .eye { position:absolute;top:17px;width:4px;height:5px;border-radius:50%;background:#3c2b27; }
  .eye.a{left:8px}.eye.b{right:8px}
  .smile { position:absolute;left:13px;top:26px;width:9px;height:5px;border-bottom:2px solid #d66c75;border-radius:50%; }
  .hairtail { position:absolute;top:25px;left:9px;width:18px;height:35px;background:#493126;border-radius:10px;z-index:1; }
  .bodygirl { position:absolute;left:15px;top:45px;width:52px;height:48px;background:#ff8eb4;border:2px solid #fff;border-radius:12px 12px 6px 6px; }
  .collar { position:absolute;top:0;left:18px;width:14px;height:12px;background:#fff;clip-path:polygon(0 0,100% 0,50% 100%); }
  .arm { position:absolute;top:52px;width:12px;height:33px;background:#ffd5b2;border-radius:9px; }
  .arm.a {left:7px;transform:rotate(20deg)} .arm.b{right:0;transform:rotate(-20deg)}
  .leg { position:absolute;top:87px;width:15px;height:27px;background:#4d63a7;border-radius:0 0 5px 5px; }
  .leg.a{left:23px}.leg.b{left:43px}
  .scorebar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin:0 0 12px; flex-wrap:wrap; }
  .pill { background:#fff; padding:10px 15px; border-radius:999px; box-shadow:0 3px 0 #b9c9e8; font-weight:900; }
  .panel { background:#ffffffed; border:3px solid white; border-radius:24px; padding:clamp(18px,4vw,30px); box-shadow:0 8px 0 #9eb7d9; }
  .progress { height:10px; border-radius:99px; background:#e7e9f6; overflow:hidden; margin-bottom:20px; }
  .progress div { height:100%; width:0%; background:linear-gradient(90deg,var(--purple),var(--pink)); transition:width .3s; }
  .qnum { color:#7767e8; font-weight:900; }
  h2 { margin:8px 0 20px; font-size:clamp(1.25rem,4vw,1.8rem); line-height:1.4; }
  .answers { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
  button { font:inherit; cursor:pointer; }
  .answer { min-height:58px; border:2px solid #d8ddf5; border-radius:16px; background:#f8f8ff; color:var(--ink); padding:12px; font-weight:800; text-align:left; transition:transform .12s,background .12s; }
  .answer:hover:not(:disabled) { transform:translateY(-2px); background:#eeeaff; border-color:var(--purple); }
  .answer:disabled { cursor:default; opacity:1; }
  .answer.correct { background:#d9f8df; border-color:#47b66a; }
  .answer.wrong { background:#ffe0e8; border-color:#ed7291; }
  .feedback { min-height:62px; margin-top:18px; padding:13px 15px; border-radius:15px; background:#f1f4ff; font-weight:800; line-height:1.6; }
  .feedback.good { background:#fff2bd; }
  .next { margin-top:15px; width:100%; border:0; border-radius:15px; padding:15px; color:white; background:var(--purple); font-weight:900; font-size:1.05rem; box-shadow:0 4px 0 #5547b9; }
  .next:hover { filter:brightness(1.05); }
  .hidden { display:none !important; }
  .final { text-align:center; }
  .final .bigscore { font-size:3.5rem; font-weight:1000; color:#7767e8; margin:8px 0; }
  .small { font-size:.9rem; color:#59658a; }
  .confetti { position:fixed; top:-20px; width:10px;height:15px; z-index:10; pointer-events:none; animation:fall 1.7s linear forwards; }
  @keyframes fall { to { transform:translateY(110vh) rotate(720deg); opacity:.1; } }
  @keyframes bob { 0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)} }
  @media(max-width:500px){ .answers{grid-template-columns:1fr}.scene{min-height:175px}.student{left:4%;transform:scale(.85);transform-origin:bottom left}.school{width:66%;left:59%} }
</style>
</head>
<body>
<main class="game">
  <header>
    <h1>🌟 나를 맞혀 봐! 🌟</h1>
    <p class="subtitle">나에 대해 얼마나 잘 알고 있을까? 퀴즈 7문제에 도전!</p>
  </header>

  <section class="scene" aria-label="대구강북초등학교를 배경으로 한 그림">
    <div class="sun"></div><div class="cloud">☁️</div>
    <div class="school">
      <div class="school-name">대구강북초등학교</div>
      <div class="windows"><span></span><span></span><span></span><span></span></div>
    </div>
    <div class="student" aria-label="여학생 캐릭터">
      <div class="hair"></div><div class="hairtail"></div>
      <div class="face"><i class="eye a"></i><i class="eye b"></i><i class="smile"></i></div>
      <div class="bodygirl"><div class="collar"></div></div>
      <div class="arm a"></div><div class="arm b"></div><div class="leg a"></div><div class="leg b"></div>
    </div>
    <div class="ground-label">🏫 우리 학교 퀴즈 타임! 🌼</div>
  </section>

  <div class="scorebar">
    <div class="pill" id="score">🏆 점수: 0 / 7</div>
    <div class="pill" id="progressText">📝 문제: 1 / 7</div>
  </div>

  <section class="panel" id="quizPanel">
    <div class="progress"><div id="progressFill"></div></div>
    <div class="qnum" id="qnum">QUESTION 1</div>
    <h2 id="question"></h2>
    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback" aria-live="polite">정답이라고 생각하는 답을 골라 봐!</div>
    <button class="next hidden" id="nextBtn">다음 문제 ➜</button>
  </section>

  <section class="panel final hidden" id="finalPanel">
    <div style="font-size:3rem">🎉🏆🎉</div>
    <h2>퀴즈 완료!</h2>
    <p>정말 수고했어!</p>
    <div class="bigscore" id="finalScore">0 / 7</div>
    <p id="finalMessage"></p>
    <button class="next" id="restartBtn">다시 도전하기 🔄</button>
    <p class="small">※ 이 퀴즈는 네가 알려준 정답을 기준으로 만들어졌어.</p>
  </section>
</main>
<script>
const questions = [
  { q:"나의 키를 맞혀 보시오!", options:["170cm","165cm","166cm","160cm"], answer:2 },
  { q:"나의 친구를 맞혀 보시오!", options:["고승재","권은후","박지유","김지용"], answer:0 },
  { q:"내가 어떤 과목을 제일 좋아하는지 맞혀 보시오!", options:["과학","국어","체육","사회"], answer:1 },
  { q:"나의 신발 크기를 맞혀 보시오!", options:["255mm","260mm","270mm","275mm"], answer:2 },
  { q:"나의 가방 브랜드를 맞혀 보시오!", options:["DISCOVERY","NIKE","PANCOAT","TEMU"], answer:0 },
  { q:"나는 집에서 몇째인지 맞혀 보시오!", options:["외동","첫째","둘째","막내"], answer:3 },
  { q:"나는 어떤 아이돌 그룹을 좋아할까요?", options:["코르티스","투바투","BTS","아이브"], answer:3 }
];
let current = 0, score = 0, locked = false;
const $ = id => document.getElementById(id);
function renderQuestion() {
  locked = false;
  const item = questions[current];
  $("qnum").textContent = `QUESTION ${current + 1}`;
  $("question").textContent = item.q;
  $("answers").innerHTML = "";
  item.options.forEach((option, i) => {
    const button = document.createElement("button");
    button.className = "answer";
    button.textContent = `${i + 1}) ${option}`;
    button.addEventListener("click", () => chooseAnswer(i));
    $("answers").appendChild(button);
  });
  $("feedback").className = "feedback";
  $("feedback").textContent = "정답이라고 생각하는 답을 골라 봐!";
  $("nextBtn").classList.add("hidden");
  $("nextBtn").textContent = current === questions.length - 1 ? "결과 보기 🏆" : "다음 문제 ➜";
  $("score").textContent = `🏆 점수: ${score} / 7`;
  $("progressText").textContent = `📝 문제: ${current + 1} / 7`;
  $("progressFill").style.width = `${(current / questions.length) * 100}%`;
}
function burstConfetti() {
  const colors = ["#ff5e8a","#ffd447","#7c6cf0","#4ac9a5","#55b9f5","#ff8b3d"];
  for (let i = 0; i < 85; i++) {
    const piece = document.createElement("span");
    piece.className = "confetti";
    piece.style.left = Math.random() * 100 + "vw";
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDelay = (Math.random() * .45) + "s";
    piece.style.transform = `rotate(${Math.random() * 360}deg)`;
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 2300);
  }
}
function chooseAnswer(choice) {
  if (locked) return;
  locked = true;
  const item = questions[current];
  const buttons = [...$("answers").querySelectorAll("button")];
  buttons.forEach((b, i) => {
    b.disabled = true;
    if (i === item.answer) b.classList.add("correct");
    if (i === choice && choice !== item.answer) b.classList.add("wrong");
  });
  if (choice === item.answer) {
    score++;
    $("feedback").className = "feedback good";
    $("feedback").textContent = "🎉 맞췄습니다! 🎉";
    burstConfetti();
  } else {
    $("feedback").className = "feedback";
    $("feedback").textContent = `아쉽지만, 할 수 있어요! 정답은 ${item.answer + 1}번 ${item.options[item.answer]}입니다.`;
  }
  $("score").textContent = `🏆 점수: ${score} / 7`;
  $("progressFill").style.width = `${((current + 1) / questions.length) * 100}%`;
  $("nextBtn").classList.remove("hidden");
}
function showResults() {
  $("quizPanel").classList.add("hidden");
  $("finalPanel").classList.remove("hidden");
  $("finalScore").textContent = `${score} / ${questions.length}`;
  $("progressText").textContent = "✅ 퀴즈 완료";
  $("finalMessage").textContent = score === 7 ? "완벽해! 모든 문제를 맞혔어! 🌈" :
    score >= 5 ? "대단해! 나에 대해 정말 잘 알고 있네! ⭐" :
    score >= 3 ? "잘했어! 다음에는 더 높은 점수에 도전해 봐! 💪" :
    "괜찮아! 다시 도전하면 더 잘할 수 있어! 💖";
  $("progressFill").style.width = "100%";
}
$("nextBtn").addEventListener("click", () => {
  if (current < questions.length - 1) { current++; renderQuestion(); }
  else showResults();
});
$("restartBtn").addEventListener("click", () => {
  current = 0; score = 0;
  $("finalPanel").classList.add("hidden");
  $("quizPanel").classList.remove("hidden");
  renderQuestion();
});
renderQuestion();
</script>
</body>
</html>
