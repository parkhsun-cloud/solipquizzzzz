<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나에 대한 퀴즈</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: linear-gradient(135deg, #ffe3f1, #e3e9ff);
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .card {
    background: #fff; width: 100%; max-width: 520px; border-radius: 24px;
    padding: 28px 22px; box-shadow: 0 10px 30px rgba(0,0,0,.12); text-align: center;
  }
  h1 { margin: 0 0 8px; font-size: 28px; color: #d6409f; }
  .sub { color: #666; margin-bottom: 22px; }
  .progress { height: 10px; background: #eee; border-radius: 10px; overflow: hidden; margin-bottom: 8px; }
  .bar { height: 100%; width: 0; background: linear-gradient(90deg, #ff8ac8, #7aa2ff); transition: width .3s; }
  .count { color: #888; font-size: 14px; margin-bottom: 16px; }
  .question { font-size: 22px; font-weight: bold; margin-bottom: 6px; color: #333; }
  .hint { color: #7a5af8; font-size: 14px; min-height: 20px; margin-bottom: 12px; }
  .option {
    display: flex; align-items: center; gap: 12px; width: 100%;
    background: #f7f7fb; border: 3px solid #e4e4ef; border-radius: 16px;
    padding: 14px 16px; margin-bottom: 10px; font-size: 18px; text-align: left;
    cursor: pointer; transition: all .2s; font-family: inherit; color: #333;
  }
  .option:active { transform: scale(.98); }
  .lamp {
    width: 22px; height: 22px; border-radius: 50%; background: #ccc;
    flex-shrink: 0; border: 2px solid #bbb; transition: all .25s;
  }
  .option.selected { border-color: #7a5af8; background: #f0ecff; }
  .option.correct { border-color: #22c55e; background: #e8fbee; }
  .option.correct .lamp { background: #22c55e; border-color: #16a34a; box-shadow: 0 0 14px 4px #22c55e; }
  .option.wrong { border-color: #ef4444; background: #ffeaea; }
  .option.wrong .lamp { background: #ef4444; border-color: #dc2626; box-shadow: 0 0 14px 4px #ef4444; }
  .option.locked { cursor: default; }
  button.main {
    margin-top: 10px; background: #d6409f; color: #fff; border: none;
    border-radius: 30px; padding: 14px 36px; font-size: 18px; font-weight: bold;
    cursor: pointer; font-family: inherit;
  }
  button.main:disabled { background: #ccc; cursor: default; }
  .result { font-size: 20px; margin: 20px 0; color: #333; }
  .big { font-size: 56px; font-weight: bold; color: #d6409f; margin: 10px 0; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="card">
  <div id="start">
    <h1>🐬 나에 대한 퀴즈 🐬</h1>
    <div class="sub">나를 얼마나 알고 있을까요?<br>총 10문제! 맞으면 초록불 💚, 틀리면 빨간불 ❤️</div>
    <button class="main" onclick="startQuiz()">시작하기</button>
  </div>

  <div id="quiz" class="hidden">
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div class="count" id="count"></div>
    <div class="question" id="question"></div>
    <div class="hint" id="hint"></div>
    <div id="options"></div>
    <button class="main hidden" id="confirm" onclick="confirmMulti()" disabled>확인</button>
    <button class="main hidden" id="next" onclick="nextQuestion()">다음 문제</button>
  </div>

  <div id="end" class="hidden">
    <h1>🎉 퀴즈 끝! 🎉</h1>
    <div class="result">10문제 중</div>
    <div class="big" id="final"></div>
    <div class="result">맞췄어요!</div>
    <button class="main" onclick="startQuiz()">다시 하기</button>
  </div>
</div>

<script>
const questions = [
  { q: "나의 생일은?", o: ["2월 14일", "1월 17일", "1월 14일", "2월 17일"], a: [2] },
  { q: "나의 수영 종목은?", o: ["접영", "자유형", "평영", "개인혼영"], a: [3] },
  { q: "내가 일어나는 시간은?", o: ["7시 50분", "7시", "7시 30분", "7시 40분"], a: [0] },
  { q: "나의 형제관계는?", o: ["오빠", "언니", "언니, 여동생", "오빠, 여동생"], a: [3] },
  { q: "내가 수영을 시작한 나이는?", o: ["5살", "6살", "4살", "10살"], a: [1] },
  { q: "나의 MBTI는?", o: ["ISFP", "INFP", "INTJ", "INTP"], a: [3] },
  { q: "나의 새로운 취미는? (2개 고르기)", o: ["영화보기", "베이킹", "기타치기", "그림그리기"], a: [1, 2] },
  { q: "내가 가장 좋아하는 스포츠는?", o: ["축구", "수영", "야구", "농구"], a: [1] },
  { q: "나의 혈액형은?", o: ["A형", "B형", "O형", "AB형"], a: [0] },
  { q: "내가 가장 좋아하는 계절은?", o: ["봄", "여름", "가을", "겨울"], a: [3] }
];

let idx = 0, correctCount = 0, selected = [], locked = false;
const $ = id => document.getElementById(id);

function show(id) {
  ["start", "quiz", "end"].forEach(s => $(s).classList.toggle("hidden", s !== id));
}

function startQuiz() {
  idx = 0; correctCount = 0;
  show("quiz");
  render();
}

function render() {
  const item = questions[idx];
  const multi = item.a.length > 1;
  selected = []; locked = false;
  $("bar").style.width = (idx / questions.length * 100) + "%";
  $("count").textContent = (idx + 1) + " / " + questions.length;
  $("question").textContent = (idx + 1) + ". " + item.q;
  $("hint").textContent = multi ? "정답이 2개예요! 두 개를 골라 주세요 👆" : "";
  $("next").classList.add("hidden");
  $("confirm").classList.toggle("hidden", !multi);
  $("confirm").disabled = true;

  const box = $("options");
  box.innerHTML = "";
  item.o.forEach((text, i) => {
    const b = document.createElement("button");
    b.className = "option";
    b.innerHTML = '<span class="lamp"></span><span>' + (i + 1) + ". " + text + "</span>";
    b.onclick = () => choose(i);
    box.appendChild(b);
  });
}

function choose(i) {
  if (locked) return;
  const item = questions[idx];
  if (item.a.length === 1) {
    selected = [i];
    reveal();
  } else {
    const pos = selected.indexOf(i);
    if (pos >= 0) selected.splice(pos, 1);
    else if (selected.length < 2) selected.push(i);
    [...$("options").children].forEach((el, k) =>
      el.classList.toggle("selected", selected.includes(k)));
    $("confirm").disabled = selected.length !== 2;
  }
}

function confirmMulti() {
  if (selected.length === 2) reveal();
}

function reveal() {
  locked = true;
  const item = questions[idx];
  const els = [...$("options").children];
  els.forEach((el, k) => {
    el.classList.remove("selected");
    el.classList.add("locked");
    if (item.a.includes(k)) el.classList.add("correct");
    else if (selected.includes(k)) el.classList.add("wrong");
  });
  const ok = selected.length === item.a.length && selected.every(s => item.a.includes(s));
  if (ok) correctCount++;
  $("hint").textContent = ok ? "정답이에요! 💚" : "아쉬워요! 초록불이 정답이에요 😢";
  $("confirm").classList.add("hidden");
  $("next").textContent = idx === questions.length - 1 ? "결과 보기" : "다음 문제";
  $("next").classList.remove("hidden");
}

function nextQuestion() {
  idx++;
  if (idx >= questions.length) {
    $("final").textContent = correctCount + "개";
    show("end");
  } else {
    render();
  }
}
</script>
</body>
</html>
