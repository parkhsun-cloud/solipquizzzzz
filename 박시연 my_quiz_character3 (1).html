<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나에 대한 퀴즈</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;
font-family:"Malgun Gothic",Arial,sans-serif;background:linear-gradient(135deg,#d9f5ff,#eee1ff,#fff1c9)}
.game{width:94%;max-width:680px;background:white;border-radius:30px;padding:24px;text-align:center;
box-shadow:0 12px 35px #0002}
h1{color:#8b65e8;margin:3px 0 5px;font-size:32px}.sub{color:#777;margin-bottom:10px}
.score{display:inline-block;background:#eee2ff;padding:9px 20px;border-radius:20px;font-size:20px;font-weight:bold}

/* 새로운 캐릭터: 단발머리 + 후드티 */
.character{width:190px;height:190px;margin:8px auto 3px;position:relative}
.hair{position:absolute;width:120px;height:125px;left:35px;top:15px;background:#33231f;
border-radius:55px 55px 35px 35px;z-index:1}
.face{position:absolute;width:88px;height:95px;left:51px;top:30px;background:#ffd9ba;
border-radius:45%;z-index:3}
.face:before,.face:after{content:"";position:absolute;top:41px;width:8px;height:12px;
background:#332d2b;border-radius:50%}
.face:before{left:22px}.face:after{right:22px}
.mouth{position:absolute;left:34px;top:66px;width:20px;height:9px;border-bottom:3px solid #df7182;border-radius:50%}
.bang{position:absolute;left:52px;top:19px;width:86px;height:48px;background:#33231f;
border-radius:50px 50px 25px 25px;z-index:4}
.bang2{position:absolute;left:92px;top:29px;width:22px;height:38px;background:#33231f;
border-radius:0 0 15px 15px;z-index:5;transform:rotate(-8deg)}
.ear{position:absolute;width:15px;height:28px;background:#ffd9ba;border-radius:50%;top:62px;z-index:2}
.ear.l{left:43px}.ear.r{right:43px}
.hoodie{position:absolute;left:38px;top:116px;width:114px;height:70px;background:#b99cff;
border-radius:38px 38px 16px 16px;z-index:2}
.hood{position:absolute;left:70px;top:108px;width:50px;height:38px;border:8px solid #9b7ee8;
border-radius:50%;z-index:3}
.string{position:absolute;width:3px;height:25px;background:#777;top:139px;z-index:5}
.string.l{left:87px}.string.r{left:105px}
.arm{position:absolute;width:19px;height:58px;background:#ffd9ba;border-radius:20px;top:120px;z-index:1}
.arm.l{left:25px;transform:rotate(25deg)}.arm.r{right:25px;transform:rotate(-25deg)}

.question{background:#f7f4ff;border-radius:20px;padding:18px;font-size:21px;font-weight:bold;margin:8px 0 15px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{border:0;border-radius:18px;padding:15px 8px;background:#e9e5ff;font-size:17px;cursor:pointer;transition:.15s}
.choice:hover:not(:disabled){transform:scale(1.03);background:#dcd4ff}
.choice:disabled{cursor:default;opacity:.7}
.result{min-height:30px;margin:15px 0 5px;font-size:20px;font-weight:bold}
.next,.restart{border:0;border-radius:22px;padding:12px 26px;font-size:17px;cursor:pointer;font-weight:bold}
.next{display:none;background:#9876ed;color:white}.final{display:none}
.final h2{color:#8b65e8;font-size:30px}.final-score{font-size:46px;font-weight:bold;color:#8b65e8;margin:18px}
.restart{background:#c8b5ff}
@media(max-width:520px){h1{font-size:27px}.choices{grid-template-columns:1fr}.question{font-size:18px}}
</style>
</head>
<body>
<div class="game">
<h1>💜 나에 대한 퀴즈 💜</h1>
<div class="sub">나를 얼마나 잘 알고 있을까?</div>
<div class="score">⭐ 점수: <span id="score">0</span>점</div>

<div class="character">
 <div class="hair"></div>
 <div class="ear l"></div><div class="ear r"></div>
 <div class="face"><div class="mouth"></div></div>
 <div class="bang"></div><div class="bang2"></div>
 <div class="hoodie"></div><div class="hood"></div>
 <div class="string l"></div><div class="string r"></div>
 <div class="arm l"></div><div class="arm r"></div>
</div>

<div id="quizArea">
 <div class="question" id="question"></div>
 <div class="choices">
  <button class="choice" id="c0" onclick="answer(0)"></button>
  <button class="choice" id="c1" onclick="answer(1)"></button>
  <button class="choice" id="c2" onclick="answer(2)"></button>
  <button class="choice" id="c3" onclick="answer(3)"></button>
 </div>
 <div class="result" id="result"></div>
 <button class="next" id="next" onclick="nextQuestion()">다음 문제 ➡️</button>
</div>

<div class="final" id="final">
 <h2>🎉 퀴즈 완료! 🎉</h2>
 <p>나에 대해 얼마나 잘 알고 있었을까?</p>
 <div class="final-score"><span id="finalScore">0</span>점</div>
 <button class="restart" onclick="restart()">🔄 다시 하기</button>
</div>
</div>

<script>
const questions=[
["1. 내가 좋아하는 아이돌 그룹은?",["투바투","엔믹스","아이브","아일릿"],2],
["2. 내가 키우는 동물은?",["강아지","고양이","햄스터","앵무새"],1],
["3. 내가 키우는 동물은 몇 마리?",["1마리","2마리","3마리","4마리"],1],
["4. 내가 가장 좋아하는 과목은?",["미술","체육","영어","사회"],1],
["5. 내가 좋아하는 놀이는?",["피구","공기놀이","탁구","야구"],0],
["6. 내가 좋아하는 음식은?",["마라탕","미역국","메밀소바","우동"],2],
["7. 내가 제일 좋아하는 계절은?",["봄","여름","가을","겨울"],2],
["8. 내가 좋아하는 색깔은?",["하얀색","검은색","하늘색","노란색"],3],
["9. 내가 좋아하는 곳은?",["집","시내","놀이공원","식당"],1],
["10. 내가 좋아하는 에이드는?",["딸기 에이드","블루레몬 에이드","청포도 에이드","오렌지 에이드"],2]
];
let current=0,score=0,answered=false;

function showQuestion(){
 answered=false;
 document.getElementById("result").textContent="";
 document.getElementById("next").style.display="none";
 const q=questions[current];
 document.getElementById("question").textContent=q[0];
 for(let i=0;i<4;i++){
  const b=document.getElementById("c"+i);
  b.textContent=(i+1)+") "+q[1][i]; b.disabled=false;
 }
}
function answer(selected){
 if(answered)return;
 answered=true;
 const q=questions[current];
 if(selected===q[2]){
  score+=10; document.getElementById("score").textContent=score;
  document.getElementById("result").textContent="🎉 정답이에요! +10점";
 }else{
  document.getElementById("result").textContent="❌ 틀렸어요!";
 }
 for(let i=0;i<4;i++)document.getElementById("c"+i).disabled=true;
 if(current<questions.length-1)document.getElementById("next").style.display="inline-block";
 else setTimeout(()=>{
  document.getElementById("quizArea").style.display="none";
  document.getElementById("final").style.display="block";
  document.getElementById("finalScore").textContent=score;
 },700);
}
function nextQuestion(){current++;showQuestion()}
function restart(){
 current=0;score=0;document.getElementById("score").textContent="0";
 document.getElementById("final").style.display="none";
 document.getElementById("quizArea").style.display="block";showQuestion();
}
showQuestion();
</script>
</body>
</html>
