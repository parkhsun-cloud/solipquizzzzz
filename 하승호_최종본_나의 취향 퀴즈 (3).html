<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나의 취향 퀴즈</title>
<style>
  :root {
    --bg: #f6f3ff; --card: #ffffff; --text: #2d2640; --sub: #7a7190;
    --accent: #7c5cff; --accent-soft: #ece7ff; --ok: #2e9e6a; --bad: #d9534f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1826; --card: #272335; --text: #f1eefc; --sub: #a9a2c4;
      --accent: #a58cff; --accent-soft: #352f4d;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px);
    line-height: 1.5;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 24px 0 48px; }
  header { text-align: center; margin-bottom: 20px; }
  header h1 { font-size: 1.6rem; margin: 0 0 6px; }
  header p { color: var(--sub); margin: 0; font-size: 0.95rem; }
  .progress { height: 8px; background: var(--accent-soft); border-radius: 99px; overflow: hidden; margin: 16px 0 24px; }
  .progress-bar { height: 100%; width: 0%; background: var(--accent); transition: width .3s; }
  .card { background: var(--card); border-radius: 16px; padding: 20px; box-shadow: 0 4px 16px rgba(0,0,0,.06); margin-bottom: 16px; }
  .qno { font-size: 0.85rem; color: var(--accent); font-weight: 600; margin-bottom: 6px; display: flex; justify-content: space-between; }
  .timer { color: var(--bad); }
  .question { font-size: 1.1rem; font-weight: 600; margin: 0 0 8px; }
  .hint { font-size: 0.9rem; color: var(--sub); margin: 0 0 12px; }
  .qimg { display: block; width: 100%; max-height: 260px; object-fit: cover; border-radius: 12px; margin: 0 0 12px; }
  input[type="text"] {
    width: 100%; padding: 12px 14px; font-size: 1rem; color: var(--text);
    background: var(--bg); border: 2px solid transparent; border-radius: 12px; outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  input[type="text"]:disabled { opacity: .7; }
  .feedback { margin-top: 10px; font-size: 0.95rem; min-height: 1.5em; }
  .feedback.ok { color: var(--ok); }
  .feedback.bad { color: var(--bad); }
  button {
    width: 100%; margin-top: 12px; padding: 12px 16px; font-size: 1rem; font-weight: 600;
    border: none; border-radius: 12px; cursor: pointer; background: var(--accent); color: #fff;
  }
  button.secondary { background: var(--accent-soft); color: var(--accent); }
  button.normal { background: #f0a500; }
  button.hard { background: #d9534f; }
  button:disabled { opacity: .4; cursor: default; }
  .row { display: flex; gap: 10px; }
  .row button { margin-top: 12px; }
  .final { text-align: center; }
  .final .score { font-size: 3rem; font-weight: 700; color: var(--accent); margin: 8px 0; }
  .rank { text-align: left; margin: 12px 0 0; padding: 0; list-style: none; }
  .rank li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 12px; border-radius: 10px; margin-bottom: 6px; background: var(--bg); }
  .rank li.me { background: var(--accent-soft); font-weight: 700; }
  .rank .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank-title { text-align: left; margin: 20px 0 4px; }
  .rank-note { color: var(--sub); font-size: 0.8rem; margin: 10px 0 0; text-align: left; }
  .hidden { display: none !important; }
  .start-card label { display: block; font-weight: 600; margin-bottom: 8px; }
  .mode-note { color: var(--sub); font-size: 0.85rem; margin: 10px 0 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>나의 취향 퀴즈</h1>
    <p>친구들과 함께 맞혀 보세요!</p>
  </header>

  <section id="start" class="card start-card">
    <label for="player">이름을 입력하세요</label>
    <input type="text" id="player" placeholder="이름" maxlength="12" autocomplete="off">
    <div class="row">
      <button class="secondary" data-level="easy">쉬움</button>
      <button class="normal" data-level="normal">보통</button>
      <button class="hard" data-level="hard">어려움</button>
    </div>
    <p class="mode-note">쉬움: 힌트 있음, 시간 제한 없음 · 보통: 힌트 있음, 문제당 15초 · 어려움: 힌트 없음, 문제당 10초, 순서 랜덤, 대소문자와 띄어쓰기까지 정확히 입력</p>
  </section>

  <section id="quiz" class="hidden">
    <div class="progress"><div class="progress-bar" id="bar"></div></div>
    <div class="card">
      <div class="qno"><span id="qno"></span><span id="live"></span></div>
      <p class="question" id="question"></p>
      <p class="hint" id="hint"></p>
      <img id="qimg" class="qimg hidden" alt="">
      <input type="text" id="answer" placeholder="답을 입력하세요" autocomplete="off">
      <div class="feedback" id="feedback"></div>
      <button id="submit">제출</button>
    </div>
  </section>

  <section id="final" class="card final hidden">
    <h2 id="finalTitle">퀴즈 끝!</h2>
    <div class="score" id="score"></div>
    <p id="scoreMsg"></p>
    <h3 class="rank-title">랭킹</h3>
    <ol class="rank" id="rank"></ol>
    <p class="rank-note" id="rankNote">랭킹 불러오는 중...</p>
    <div class="row">
      <button id="again" class="secondary">다시 하기</button>
      <button id="nextPerson">다음 사람</button>
    </div>
  </section>
</div>

  ];

  const LEVELS = {
    easy:   { label: "쉬움",   questions: EASY_QUESTIONS,   hints: true,  time: 0,  shuffle: false, exact: false },
    normal: { label: "보통",   questions: NORMAL_QUESTIONS, hints: true,  time: 15, shuffle: false, exact: false },
    hard:   { label: "어려움", questions: HARD_QUESTIONS,   hints: false, time: 10, shuffle: true,  exact: true  }
  };

  const RANK_LIMIT = 50;
  let db = null;
  let rankingDocs = [];
  let myRankId = null;
  let playerName = "";
  let level = "easy";
  let cfg = LEVELS.easy;
  let deck = EASY_QUESTIONS;
  let current = 0;
  let score = 0;
  let locked = false;
  let timer = null;
  let timeLeft = 0;

  const $ = id => document.getElementById(id);
  const el = {
    start: $("start"), player: $("player"),
    quiz: $("quiz"), bar: $("bar"), qno: $("qno"), live: $("live"),
    question: $("question"), hint: $("hint"), qimg: $("qimg"),
    answer: $("answer"), feedback: $("feedback"), submit: $("submit"),
    final: $("final"), finalTitle: $("finalTitle"), score: $("score"),
    scoreMsg: $("scoreMsg"), rank: $("rank"), rankNote: $("rankNote"),
    again: $("again"), nextPerson: $("nextPerson")
  };

  function normalize(s) {
    return s.toLowerCase().replace(/\s+/g, "").replace(/[.,!?~]/g, "");
  }

  function isCorrect(item, text) {
    if (!item.answer) return false;
    const options = item.answer.split("|");
    if (cfg.exact) return options.some(a => a === text);
    return options.some(a => normalize(a) === normalize(text));
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function showScreen(name) {
    el.start.classList.toggle("hidden", name !== "start");
    el.quiz.classList.toggle("hidden", name !== "quiz");
    el.final.classList.toggle("hidden", name !== "final");
  }

  function setFeedback(text, type) {
    el.feedback.textContent = text;
    el.feedback.className = "feedback " + (type || "");
  }

  function updateLive() {
    let text = `점수 ${score}`;
    if (cfg.time > 0) text += `  ·  남은 시간 ${timeLeft}초`;
    el.live.textContent = text;
    el.live.className = cfg.time > 0 ? "timer" : "";
  }

  function clearTimer() {
    if (timer) { clearInterval(timer); timer = null; }
  }

  function startTimer() {
    clearTimer();
    if (cfg.time <= 0) return;
    timeLeft = cfg.time;
    updateLive();
    timer = setInterval(() => {
      timeLeft--;
      updateLive();
      if (timeLeft <= 0) {
        clearTimer();
        timeUp();
      }
    }, 1000);
  }

  function render() {
    const item = deck[current];
    el.qno.textContent = `Q${current + 1} / ${deck.length}`;
    el.question.textContent = item.q;
    el.hint.textContent = cfg.hints ? item.hint : "";
    el.bar.style.width = (current / deck.length * 100) + "%";
    if (item.img) { el.qimg.src = item.img; el.qimg.classList.remove("hidden"); }
    else { el.qimg.removeAttribute("src"); el.qimg.classList.add("hidden"); }
    el.answer.value = "";
    el.answer.disabled = false;
    el.submit.disabled = false;
    setFeedback("");
    locked = false;
    updateLive();
    startTimer();
    el.answer.focus();
  }

  function lockInput() {
    locked = true;
    clearTimer();
    el.answer.disabled = true;
    el.submit.disabled = true;
  }

  function revealText(item) {
    return item.answer ? item.answer.split("|").join(" 또는 ") : "정답 미입력";
  }

  function submit() {
    if (locked) return;
    const text = el.answer.value.trim();
    if (!text) { setFeedback("답을 입력해 주세요.", "bad"); return; }
    lockInput();

    const item = deck[current];
    if (isCorrect(item, text)) {
      score++;
      setFeedback("정답! 🎉", "ok");
      updateLive();
      setTimeout(next, 700);
    } else {
      setFeedback(`오답! 정답: ${revealText(item)}`, "bad");
      setTimeout(next, 1600);
    }
  }

  function timeUp() {
    if (locked) return;
    lockInput();
    setFeedback(`시간 초과! 정답: ${revealText(deck[current])}`, "bad");
    setTimeout(next, 1600);
  }

  function next() {
    current++;
    if (current < deck.length) render();
    else finish();
  }

  function renderRanking() {
    el.rank.innerHTML = "";
    if (!db) { el.rankNote.textContent = "이 환경에서는 랭킹을 불러올 수 없어요."; return; }
    const list = rankingDocs
      .slice()
      .sort((a, b) => (b.score / b.total - a.score / a.total) || (a.date - b.date))
      .slice(0, 10);
    el.rankNote.textContent = list.length
      ? "다른 기기에서 저장한 기록도 함께 보여요. 난이도는 이름 뒤에 표시돼요."
      : "아직 기록이 없어요. 첫 기록을 남겨 보세요!";
    list.forEach((r, i) => {
      const li = document.createElement("li");
      if (r.id === myRankId) li.classList.add("me");
      const name = document.createElement("span");
      name.className = "name";
      const tag = LEVELS[r.level] ? ` [${LEVELS[r.level].label}]` : "";
      name.textContent = `${i + 1}위  ${r.name || "익명"}${tag}`;
      const sc = document.createElement("span");
      sc.textContent = `${r.score} / ${r.total}`;
      li.append(name, sc);
      el.rank.appendChild(li);
    });
  }

  function startRankingListener() {
    db.collection("ranking").orderBy("score", "desc").limit(RANK_LIMIT).onSnapshot(snap => {
      rankingDocs = snap.docs
        .filter(d => d.exists)
        .map(d => Object.assign({ id: d.id }, d.data() || {}));
      renderRanking();
    }, () => {
      el.rankNote.textContent = "랭킹을 불러오지 못했어요.";
    });
  }

  async function finish() {
    clearTimer();
    const entry = { name: playerName, level, score, total: deck.length, date: Date.now() };
    myRankId = null;

    el.bar.style.width = "100%";
    el.finalTitle.textContent = `${playerName}님, 퀴즈 끝! (${LEVELS[level].label})`;
    el.score.textContent = `${score} / ${deck.length}`;
    const ratio = deck.length ? score / deck.length : 0;
    el.scoreMsg.textContent = level === "hard"
      ? (ratio >= 0.8 ? "어려움 클리어! 진짜 찐친이시네요!" : ratio >= 0.5 ? "어려움 생존 성공!" : "어려움은 역시 어렵죠?")
      : (ratio >= 0.8 ? "나를 아주 잘 아시네요!" : ratio >= 0.5 ? "꽤 잘 맞히셨어요!" : "아직 알아갈 것이 많네요!");
    showScreen("final");
    renderRanking();

    if (db) {
      try {
        el.rankNote.textContent = "점수를 저장하는 중...";
        const ref = await db.collection("ranking").add(entry);
        myRankId = ref.id;
      } catch (e) {
        el.rankNote.textContent = "점수를 저장하지 못했어요. 다시 시도해 주세요.";
      }
      renderRanking();
    }
  }

  function begin(selectedLevel) {
    const name = el.player.value.trim();
    if (!name) { el.player.focus(); return; }
    playerName = name;
    level = selectedLevel;
    startQuiz();
  }

  document.querySelectorAll("[data-level]").forEach(btn => {
    btn.addEventListener("click", () => begin(btn.dataset.level));
  });

  function startQuiz() {
    cfg = LEVELS[level];
    deck = cfg.shuffle ? shuffle(cfg.questions) : cfg.questions;
    if (deck.length === 0) { alert("이 난이도의 문제가 아직 없어요."); return; }
    current = 0;
    score = 0;
    myRankId = null;
    showScreen("quiz");
    render();
  }

  el.submit.addEventListener("click", submit);
  el.answer.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
  el.again.addEventListener("click", startQuiz);
  el.nextPerson.addEventListener("click", () => {
    el.player.value = "";
    showScreen("start");
    el.player.focus();
  });

  showScreen("start");

  (async () => {
    try { db = await window.claude.use("db"); }
    catch (e) { db = null; }
    if (db) startRankingListener();
    renderRanking();
  })();
</script>
</body>
</html>
